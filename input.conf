# ==============================================================================
#  input.conf
# ==============================================================================

# ---------- Mouse ----------
MBTN_LEFT      cycle pause               # click: play/pause
MBTN_LEFT_DBL  cycle fullscreen          # double click: fullscreen
MBTN_RIGHT     no-osd seek -5 exact      # right click: back 5 s
MBTN_MID       no-osd seek  5 exact      # middle click: forward 5 s

# Touchpad scroll / swipe does nothing (avoids accidental seek & volume jumps)
WHEEL_UP    ignore
WHEEL_DOWN  ignore
WHEEL_LEFT  ignore
WHEEL_RIGHT ignore

# ---------- Seeking ----------
RIGHT        seek  5 exact
LEFT         seek -5 exact
Ctrl+RIGHT   seek  60 exact
Ctrl+LEFT    seek -60 exact
Shift+RIGHT  frame-step
Shift+LEFT   frame-back-step

# ---------- Volume ----------
UP    add volume  2.5
DOWN  add volume -2.5
m     cycle mute

# ---------- Tracks / view ----------
a     cycle audio
s     cycle sub
F4    cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"
c     script-message osc-visibility cycle       # toggle on-screen controller

# ---------- Performance profiles ----------
F2    apply-profile battery ; show-text "Battery saver ON"
F3    apply-profile battery restore ; show-text "High quality ON"
F5    cycle interpolation

# ---------- Misc ----------
Ctrl+q  quit
ENTER   ignore
Ctrl+f  script-binding selectformat/menu        # YouTube quality picker
Ctrl+o  script-binding file_browser/browse-files # file browser

# ---------- Gallery scripts ----------
g       script-message contact-sheet-close ; script-message playlist-view-toggle
Ctrl+g  script-message playlist-view-close ; script-message contact-sheet-toggle
