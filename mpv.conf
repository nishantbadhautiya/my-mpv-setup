# ==============================================================================
#  mpv.conf — HP 14s · Ryzen 3 5300U (Radeon Vega iGPU) · 1920x1080@60 · KDE Wayland
# ==============================================================================

# ---------- Video output / GPU ----------
vo=gpu-next                    # modern libplacebo renderer
gpu-api=vulkan                 # vulkan-radeon is installed; best path on Wayland
gpu-context=waylandvk
hwdec=auto-safe                # uses VA-API/Vulkan on Radeon (H.264, HEVC, VP9 in hardware)
gpu-shader-cache-dir=~~cache/shaders

# ---------- Quality (tuned for a Vega 6 iGPU: sharp but not heat-heavy) ----------
profile=high-quality           # replaces the deprecated "gpu-hq"
scale=spline36                 # upscaling (720p -> 1080p): sharp, light on iGPU
cscale=spline36
dscale=mitchell                # downscaling (4K -> 1080p)
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes                     # removes banding on low-bitrate web/BluRay rips
deband-iterations=1
deband-threshold=48
dither-depth=auto

# ---------- Smooth motion (removes judder of 24fps films on a 60Hz panel) ----------
video-sync=display-resample
interpolation=yes
tscale=oversample              # cheapest interpolation, no soap-opera effect

# ---------- Window / player behaviour ----------
fs=yes
keep-open=yes
cursor-autohide=1000
osd-bar=yes
osd-font-size=30
osd-duration=1500
force-window=immediate

# ---------- Audio ----------
volume=40
volume-max=150                 # allow boosting quiet laptop speakers
audio-file-auto=fuzzy
audio-pitch-correction=yes

# ---------- Subtitles ----------
sub-auto=fuzzy
slang=en,eng,hi,hin
sub-font-size=30
sub-border-size=2
sub-shadow-offset=1
sub-fix-timing=yes
embeddedfonts=yes

# ---------- Cache / streaming (7 GB RAM laptop) ----------
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB
# Radeon (Renoir) has no AV1 hardware decoder -> avoid AV1 so YouTube stays cool and smooth
ytdl-format=bestvideo[height<=?1080][vcodec!^=av01]+bestaudio/best[height<=?1080]
ytdl-raw-options=sub-langs=[en.*,hi.*],write-auto-subs=

# ---------- Screenshots ----------
screenshot-directory=~/Pictures/Screenshots
screenshot-template="%F-%P"
screenshot-format=png
screenshot-png-compression=7

# ---------- Resume ----------
# save-position-on-quit        # uncomment to resume files where you left off

# ==============================================================================
#  Profiles
# ==============================================================================

# Battery saver — toggle with F2 (see input.conf)
[battery]
profile-restore=copy-equal
scale=bilinear
cscale=bilinear
dscale=bilinear
deband=no
interpolation=no
video-sync=audio

# Auto: drop interpolation on high-fps content (already smooth, saves GPU)
[high-fps]
profile-cond=container_fps and container_fps > 31
profile-restore=copy-equal
interpolation=no
